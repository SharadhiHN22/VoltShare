services:
  # ── VoltShare Backend API Service ───────────────────────
  - type: web
    name: voltshare-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm --workspace=@voltshare/shared run build && DATABASE_URL="${DATABASE_URL:-mysql://dummy:dummy@localhost:3306/voltshare}" npm --workspace=@voltshare/api run db:generate && npm --workspace=@voltshare/api run build
    startCommand: npm --workspace=@voltshare/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: voltshare-web
          property: host
      - key: OPEN_CHARGE_MAP_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: PLATFORM_FEE_PERCENT
        value: 10

  # ── VoltShare Frontend Web Service ──────────────────────
  - type: web
    name: voltshare-web
    runtime: node
    plan: starter
    buildCommand: npm install && npm --workspace=@voltshare/shared run build && npm --workspace=@voltshare/web run build
    startCommand: npm --workspace=@voltshare/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: voltshare-api
          property: host
